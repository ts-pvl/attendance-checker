---
# ansible-playbook -i inventory.ini site.yml --ask-vault-pass
# Build the server binary first: make pi (or make amd64).

- name: Attendance server
  hosts: attendance_server
  become: true
  roles:
    - attendance_server

# The PC group comes from attendance_pc_group (default lab_pcs); deploy/install.sh
# sets it to the "students" group of the admin PC's existing inventory.
- name: Lab PCs (agent, autostart, browser homepage)
  hosts: "{{ attendance_pc_group | default('lab_pcs') }}"
  become: true
  roles:
    - attendance_agent
