---
- name: Check that the host key is set (Ansible Vault)
  ansible.builtin.assert:
    that:
      - attendance_host_key is defined
      - attendance_host_key | length >= 16
    fail_msg: "Set attendance_host_key (at least 16 characters) in the vault. Generate one with: attendance gen-key"
    quiet: true

- name: Install tools the agent needs
  ansible.builtin.package:
    name: [curl, util-linux, libnotify-bin]
    state: present

- name: Config directory
  ansible.builtin.file:
    path: /etc/attendance
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Agent config
  ansible.builtin.template:
    src: agent.conf.j2
    dest: /etc/attendance/agent.conf
    owner: root
    group: root
    mode: "0644"

# Readable by the generic student account on purpose (spec 10.2 item 11):
# it lets a PC prove "a session is alive", never who is sitting there.
- name: Host key
  ansible.builtin.copy:
    content: "{{ attendance_host_key }}\n"
    dest: /etc/attendance/host_key
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Agent script (revised idle_logout)
  ansible.builtin.copy:
    src: "{{ attendance_agent_script_src }}"
    dest: /usr/local/bin/idle_logout
    owner: root
    group: root
    mode: "0755"
    backup: true

# System-wide autostart, so wiped home directories cannot lose it.
- name: Autostart entry for the agent
  ansible.builtin.copy:
    src: idle-logout.desktop
    dest: /etc/xdg/autostart/idle-logout.desktop
    owner: root
    group: root
    mode: "0644"

- name: Autostart entry that opens the QR page after login
  ansible.builtin.template:
    src: attendance-qr.desktop.j2
    dest: /etc/xdg/autostart/attendance-qr.desktop
    owner: root
    group: root
    mode: "0644"
  when: attendance_open_qr_at_login | bool

- name: Remove the QR autostart entry when disabled
  ansible.builtin.file:
    path: /etc/xdg/autostart/attendance-qr.desktop
    state: absent
  when: not (attendance_open_qr_at_login | bool)

- name: Firefox policy directory
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    mode: "0755"
  when: "'firefox' in attendance_browsers"

- name: Firefox homepage policy (deb and snap Firefox both read this file)
  ansible.builtin.template:
    src: firefox-policies.json.j2
    dest: /etc/firefox/policies/policies.json
    mode: "0644"
  when: "'firefox' in attendance_browsers"

- name: Chrome policy directory
  ansible.builtin.file:
    path: /etc/opt/chrome/policies/managed
    state: directory
    mode: "0755"
  when: "'chrome' in attendance_browsers"

- name: Chrome homepage policy
  ansible.builtin.template:
    src: chrome-policy.json.j2
    dest: /etc/opt/chrome/policies/managed/attendance.json
    mode: "0644"
  when: "'chrome' in attendance_browsers"

- name: Chromium policy directories (Debian package and Ubuntu snap paths)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/chromium/policies/managed
    - /etc/chromium-browser/policies/managed
  when: "'chromium' in attendance_browsers"

- name: Chromium homepage policy
  ansible.builtin.template:
    src: chrome-policy.json.j2
    dest: "{{ item }}/attendance.json"
    mode: "0644"
  loop:
    - /etc/chromium/policies/managed
    - /etc/chromium-browser/policies/managed
  when: "'chromium' in attendance_browsers"

# ── overlayroot ────────────────────────────────────────────────────────────
# Lab PCs that boot with overlayroot keep / in RAM: everything above is lost
# at reboot and the original files come back from the read-only lower disk.
# Write the same files to the lower disk too.
#
# Files are copied straight onto the lower disk (remount rw, copy, remount ro),
# not through overlayroot-chroot: on the lab PCs overlayroot-chroot often
# cannot unmount its /run and /sys bind mounts afterwards ("target is busy"),
# then leaves the disk read-write and fails every later call. The chroot is
# used only to install missing packages, and any mounts it leaves behind are
# detached afterwards.
- name: Detect overlayroot
  ansible.builtin.shell:
    cmd: |
      set -eu
      [ "$(findmnt -n -o FSTYPE /)" = overlay ] || exit 0
      command -v overlayroot-chroot >/dev/null || exit 0
      findmnt -n -o OPTIONS / | tr ',' '\n' | sed -n 's/^lowerdir=//p' | cut -d: -f1
  register: attendance_overlay
  changed_when: false

- name: Install the agent's tools on the lower disk (overlayroot)
  ansible.builtin.shell:
    cmd: |
      set -eu
      lower={{ attendance_overlay.stdout | quote }}
      # Detach the /dev, /proc, /run and /sys mounts an earlier
      # overlayroot-chroot left on the lower disk, and make it read-only again.
      settle() {
        findmnt -rn -o TARGET | grep -E "^$lower/(dev|proc|run|sys)(/|\$)" | sort -r | while read -r m; do
          umount -l "$m" 2>/dev/null || true
        done
        sync
        for _ in 1 2 3; do
          mount -o remount,ro "$lower" 2>/dev/null && return 0
          sleep 1
        done
        echo "warning: $lower stays read-write until the next reboot"
      }
      missing_pkgs() {
        for p in curl util-linux libnotify-bin; do
          st=$(dpkg-query --admindir="$lower/var/lib/dpkg" -W -f='${db:Status-Status}' "$p" 2>/dev/null || true)
          [ "$st" = installed ] || printf ' %s' "$p"
        done
      }
      missing=$(missing_pkgs)
      [ -n "$missing" ] || { echo unchanged; exit 0; }
      # Its exit status is not trusted (see above): check the result instead.
      overlayroot-chroot sh -c "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $missing" || true
      settle
      still=$(missing_pkgs)
      if [ -n "$still" ]; then echo "not installed on the lower disk:$still" >&2; exit 1; fi
      echo changed
  register: attendance_overlay_pkgs
  changed_when: "'changed' in attendance_overlay_pkgs.stdout_lines"
  when: attendance_overlay.stdout != ""

- name: Copy the agent files to the lower disk (overlayroot)
  ansible.builtin.shell:
    cmd: |
      set -eu
      lower={{ attendance_overlay.stdout | quote }}
      # Files this role writes. A missing one that is ours by name (the QR
      # autostart turned off) is removed from the lower disk as well; shared
      # files such as the Firefox policies.json never are.
      files="{{ attendance_overlay_files | join(' ') }}"
      differs() {  # $1 = path; true if live and lower copies differ
        [ -e "$lower$1" ] || return 0
        cmp -s "$1" "$lower$1" || return 0
        [ "$(stat -c %a:%u:%g "$1")" != "$(stat -c %a:%u:%g "$lower$1")" ]
      }
      # Detach the /dev, /proc, /run and /sys mounts an earlier
      # overlayroot-chroot left on the lower disk, and make it read-only again.
      settle() {
        findmnt -rn -o TARGET | grep -E "^$lower/(dev|proc|run|sys)(/|\$)" | sort -r | while read -r m; do
          umount -l "$m" 2>/dev/null || true
        done
        sync
        for _ in 1 2 3; do
          mount -o remount,ro "$lower" 2>/dev/null && return 0
          sleep 1
        done
        echo "warning: $lower stays read-write until the next reboot"
      }
      copy="" remove=""
      for f in $files; do
        if [ -e "$f" ]; then
          if differs "$f"; then copy="$copy ${f#/}"; fi
        elif [ -e "$lower$f" ]; then
          case "$f" in *attendance*) remove="$remove $f" ;; esac
        fi
      done
      if [ -z "$copy$remove" ]; then
        # Nothing to write, but still undo what an earlier failed run left.
        if findmnt -rn -o TARGET | grep -qE "^$lower/(dev|proc|run|sys)(/|\$)" || findmnt -n -o OPTIONS "$lower" | grep -q '^rw'; then settle; fi
        echo unchanged; exit 0
      fi
      settle >/dev/null
      mount -o remount,rw "$lower"
      trap settle EXIT
      # The first time a file on the lower disk is replaced, keep the original
      # as <file>.orig (e.g. the old idle_logout), so it can be restored by hand.
      # GNOME autostart and the browsers ignore the .orig names.
      for f in $copy; do
        case "$f" in etc/attendance/*) continue ;; esac
        if [ -e "$lower/$f" ] && [ ! -e "$lower/$f.orig" ]; then cp -p "$lower/$f" "$lower/$f.orig"; fi
      done
      if [ -n "$copy" ]; then
        # shellcheck disable=SC2086
        tar -C / -cf - $copy | tar -xpf - -C "$lower"
      fi
      for f in $remove; do rm -f "$lower$f"; done
      for f in $copy; do
        if differs "/$f"; then echo "not written to the lower disk: /$f" >&2; exit 1; fi
      done
      echo changed
  register: attendance_overlay_sync
  changed_when: "'changed' in attendance_overlay_sync.stdout_lines"
  when: attendance_overlay.stdout != ""

- name: Report a lower disk left read-write
  ansible.builtin.debug:
    msg: "{{ (attendance_overlay_pkgs.stdout_lines | default([]) + attendance_overlay_sync.stdout_lines | default([])) | select('match', '^warning') | list }}"
  when: >-
    attendance_overlay.stdout != "" and
    (attendance_overlay_pkgs.stdout_lines | default([]) + attendance_overlay_sync.stdout_lines | default([])) | select('match', '^warning') | list | length > 0
