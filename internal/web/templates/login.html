{{define "content"}}
<section class="login">
  <h1>{{t "login.title"}}</h1>
  {{with .D}}{{with .Error}}<p class="flash err">{{t .}}</p>{{end}}{{end}}
  <form method="post" action="/admin/login" class="stack">
    <label>{{t "login.username"}}
      <input name="username" autocomplete="username" required autofocus value="{{with .D}}{{.Username}}{{end}}">
    </label>
    <label>{{t "login.password"}}
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button>{{t "login.submit"}}</button>
  </form>
</section>
{{end}}
